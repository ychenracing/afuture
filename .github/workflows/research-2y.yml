name: research-2y

on:
  push:
    branches:
      - codex/afuture-2y-realdata-optimization-20260821
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install akshare pandas
      - run: python tools/probe_two_year_real_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: two-year-real-data-probe
          path: |
            runtime/realdata_probe.json
            runtime/two_year_exchange_daily.csv
          retention-days: 7
