name: research-2y

on:
  push:
    branches:
      - codex/afuture-2y-realdata-optimization-20260821
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install akshare pandas
      - run: python tools/probe_two_year_real_data.py
      - run: python tools/fetch_two_year_60m_universe.py
      - run: python tools/fetch_prior_two_year_60m_universe.py
      - run: python tools/fetch_oi_extended_60m.py
      - run: python tools/fetch_two_year_30m_universe.py
      - uses: actions/upload-artifact@v4
        with:
          name: two-year-real-data-probe
          path: |
            runtime/realdata_probe.json
            runtime/two_year_specific_contract_daily.csv
            runtime/two_year_specific_contract_60m.csv
            runtime/two_year_broad_60m.csv
            runtime/two_year_broad_60m_summary.csv
            runtime/two_year_broad_60m_failures.txt
            runtime/prior_two_year_broad_60m.csv
            runtime/prior_two_year_broad_60m_summary.csv
            runtime/prior_two_year_broad_60m_failures.txt
            runtime/oi_2022_2024_60m.csv
            runtime/two_year_broad_30m.csv
            runtime/two_year_broad_30m_summary.csv
            runtime/two_year_broad_30m_failures.txt
          retention-days: 7
