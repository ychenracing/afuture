name: research-2y

# 两年真实数据抓取和完整研究属于高成本 L4 证据门。研究逻辑或其回归测试变化时，
# PR 必须重新执行；普通生产代码小改动仍由 ci.yml 负责，避免无价值地重复下载数据。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/evaluate_daily_relative_strategy.py"
      - "tools/diagnose_two_year_selection.py"
      - "tools/test_alignment.py"
      - "tools/fetch_two_year_60m_universe.py"
      - "tools/fetch_prior_two_year_60m_universe.py"
      - ".github/workflows/research-2y.yml"

permissions:
  contents: read

concurrency:
  group: research-2y-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install akshare pandas
      - name: 验证生产采样、交易日、front-3 和活动度语义
        run: python tools/test_alignment.py
      - name: Fetch recent two-year 60-minute universe
        run: python tools/fetch_two_year_60m_universe.py
      - name: Fetch independent prior two-year 60-minute universe
        run: python tools/fetch_prior_two_year_60m_universe.py
      - name: 输出修正后选择与经济诊断
        run: python tools/diagnose_two_year_selection.py
      - name: Validate two-window strategy evidence
        run: python tools/evaluate_daily_relative_strategy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-year-real-data-evidence
          path: |
            runtime/two_year_broad_60m.csv
            runtime/two_year_broad_60m_summary.csv
            runtime/two_year_broad_60m_failures.txt
            runtime/prior_two_year_broad_60m.csv
            runtime/prior_two_year_broad_60m_summary.csv
            runtime/prior_two_year_broad_60m_failures.txt
            runtime/two_year_diagnostic.json
            runtime/two_year_strategy_report.json
          retention-days: 14
