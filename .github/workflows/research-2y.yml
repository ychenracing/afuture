name: research-2y

# Two-year real data is an expensive L4 economic gate. code 0=promotion and
# code 2=economic rejection for the specific-contract strategy; both mean the
# research program completed normally. Other non-zero exits are engineering failures.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/evaluate_daily_relative_strategy.py"
      - "tools/test_alignment.py"
      - "tools/fetch_two_year_60m_universe.py"
      - "tools/fetch_prior_two_year_60m_universe.py"
      - "tools/fetch_broad_daily_universe.py"
      - "tools/evaluate_broad_relative_families.py"
      - "tools/test_broad_relative_families.py"
      - ".github/workflows/research-2y.yml"

permissions:
  contents: read

concurrency:
  group: research-2y-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install akshare pandas

      - name: Verify production sampling, trading-day, front-3 and activity semantics
        run: python tools/test_alignment.py
      - name: Fetch recent two-year 60-minute universe
        run: python tools/fetch_two_year_60m_universe.py
      - name: Fetch independent prior two-year 60-minute universe
        run: python tools/fetch_prior_two_year_60m_universe.py
      - name: Validate two-window specific-contract strategy evidence
        run: |
          set +e
          python tools/evaluate_daily_relative_strategy.py
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          python - <<'PY'
          import json
          report = json.load(open("runtime/two_year_strategy_report.json", encoding="utf-8"))
          assert "accepted" in report
          assert "promotion_reasons" in report
          assert "qualified_prior" in report and "qualified_current" in report
          assert "final_oos" in report and "full_recent" in report
          assert report["historical_l1_available"] is False
          print(json.dumps({
              "accepted": report["accepted"],
              "promotion_reasons": report["promotion_reasons"],
              "qualified_prior": report["qualified_prior"],
              "qualified_current": report["qualified_current"],
              "target": report["target"],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Verify broad relative-value research causality
        run: python tools/test_broad_relative_families.py
      - name: Fetch broad continuous daily factor universe
        run: python tools/fetch_broad_daily_universe.py
      - name: Screen broad market-neutral relative-value families
        run: |
          python tools/evaluate_broad_relative_families.py
          python - <<'PY'
          import json
          report = json.load(open("runtime/broad_relative_family_report.json", encoding="utf-8"))
          assert report["candidate_count"] == 16
          assert report["coverage"]["products"] >= 20
          assert report["pristine_final_oos"] is False
          assert report["historical_l1_available"] is False
          assert "target_met" in report["target"]
          print(json.dumps({
              "coverage": report["coverage"],
              "prior_selected": report["prior_selected"],
              "current_selected": report["current_selected"],
              "prior_forward_train": report["prior_forward_train"],
              "selected_leverage": report["selected_leverage"],
              "selected_stress": report["selected_stress"],
              "target": report["target"],
          }, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-year-real-data-evidence
          path: |
            runtime/two_year_broad_60m.csv
            runtime/two_year_broad_60m_summary.csv
            runtime/two_year_broad_60m_failures.txt
            runtime/prior_two_year_broad_60m.csv
            runtime/prior_two_year_broad_60m_summary.csv
            runtime/prior_two_year_broad_60m_failures.txt
            runtime/two_year_strategy_report.json
            runtime/broad_daily_universe.csv
            runtime/broad_daily_universe_summary.csv
            runtime/broad_daily_universe_failures.txt
            runtime/broad_relative_family_report.json
          retention-days: 14
