name: research-return-target-specific

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/test_return_target_specific.py"
      - "tools/fetch_return_target_specific_daily.py"
      - "tools/evaluate_return_target_specific.py"
      - "tools/evaluate_aggressive_directional.py"
      - "tools/fetch_broad_daily_universe.py"
      - ".github/workflows/research-return-target-specific.yml"

permissions:
  contents: read

concurrency:
  group: research-return-target-specific-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  specific-return-target:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install akshare pandas numpy
      - name: Verify frozen config and roll-safe causality
        run: python tools/test_return_target_specific.py
      - name: Rebuild frozen L3 directional evidence
        run: |
          python tools/fetch_broad_daily_universe.py
          python tools/evaluate_aggressive_directional.py
      - name: Fetch all concrete contracts needed for L4
        run: python tools/fetch_return_target_specific_daily.py
      - name: Validate continuous signals on roll-safe concrete contracts
        run: |
          python tools/evaluate_return_target_specific.py
          python - <<'PY'
          import json
          report = json.load(open("runtime/return_target_specific_report.json", encoding="utf-8"))
          assert report["specific_contracts"] is True
          assert report["roll_safe"] is True
          assert report["pristine_final_oos"] is False
          assert report["max_gross_leverage"] <= 2.0
          assert report["selection_frozen"] is True
          print(json.dumps({
              "data_quality": report["data_quality"],
              "frozen_weight_replay": report["frozen_weight_replay"],
              "continuous_signal_roll_safe": report["continuous_signal_roll_safe"],
              "target": report["target"],
          }, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return-target-specific-evidence
          path: |
            runtime/broad_daily_universe.csv
            runtime/aggressive_directional_report.json
            runtime/aggressive_directional_weights.csv
            runtime/return_target_specific_contracts.csv
            runtime/return_target_specific_summary.csv
            runtime/return_target_specific_failures.txt
            runtime/return_target_specific_selection.csv
            runtime/return_target_specific_report.json
          retention-days: 14
