name: research-specific-pairs

# Targeted L4 roll-safe validation. It fetches only concrete contracts needed by
# the economic pairs that survived L3; economic rejection is a valid result.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/fetch_specific_pair_daily_universe.py"
      - "tools/evaluate_specific_pair_rotation.py"
      - "tools/test_specific_pair_rotation.py"
      - ".github/workflows/research-specific-pairs.yml"

permissions:
  contents: read

concurrency:
  group: research-specific-pairs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  specific-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install akshare pandas
      - name: Verify roll-safe contract selection causality
        run: python tools/test_specific_pair_rotation.py
      - name: Fetch targeted concrete futures contracts
        run: python tools/fetch_specific_pair_daily_universe.py
      - name: Validate strongest-pair rotation on roll-safe contracts
        run: |
          python tools/evaluate_specific_pair_rotation.py
          python - <<'PY'
          import json
          report = json.load(open("runtime/specific_pair_rotation_report.json", encoding="utf-8"))
          assert report["specific_contracts"] is True
          assert report["roll_safe"] is True
          assert report["pristine_final_oos"] is True
          assert report["historical_l1_available"] is False
          assert report["pair_count"] == 6
          assert report["profile_count"] == 24
          assert report["max_active_pairs"] == 1
          assert report["selected_leverage"] <= report["max_gross_leverage"]
          assert set(report["data_quality"]) == {"AL", "BU", "CU", "FU", "J", "JM", "P", "PP", "V", "Y", "ZN"}
          assert all(
              item["missing_next_ratio"] < 0.10
              for item in report["data_quality"].values()
          )
          print(json.dumps({
              "data_quality": report["data_quality"],
              "support": report["support"],
              "selected_profile": report["selected_profile"],
              "selected_prior_pairs": report["selected_prior_pairs"],
              "selected_current_pairs": report["selected_current_pairs"],
              "selected_prior_forward_train": report["selected_prior_forward_train"],
              "selected_leverage": report["selected_leverage"],
              "selected_oos": report["selected_oos"],
              "selected_full_recent": report["selected_full_recent"],
              "alpha_survives_specific_contract": report["alpha_survives_specific_contract"],
              "alpha_reasons": report["alpha_reasons"],
              "target": report["target"],
          }, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specific-pair-roll-safe-evidence
          path: |
            runtime/specific_pair_daily_contracts.csv
            runtime/specific_pair_daily_summary.csv
            runtime/specific_pair_daily_failures.txt
            runtime/specific_pair_roll_selection.csv
            runtime/specific_pair_roll_safe_indices.csv
            runtime/specific_pair_rotation_report.json
          retention-days: 14
