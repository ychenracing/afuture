name: targeted-production-return

on:
  push:
    branches:
      - codex/afuture-production-return-100-20260823

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Targeted return/recovery tests
        run: >-
          python -m pytest -q
          tests/test_directional_risk_governor.py
          tests/test_directional_daily_recovery.py
