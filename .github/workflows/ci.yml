name: ci

on:
  push:
  pull_request:

jobs:
  directional-trading-day-targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Directional trading-day regression
        run: >-
          python -m pytest -q
          tests/test_directional_trading_day_selection.py
          tests/test_execution_aligned_runtime.py
          tests/test_directional_review_regressions.py
      - run: python -m compileall -q afuture
