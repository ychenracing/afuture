name: research-intraday-pairs

# Targeted L4 intraday experiment. This workflow is isolated from daily and broad
# research so changes do not repeat unrelated expensive evidence.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/fetch_specific_pair_60m_universe.py"
      - "tools/evaluate_specific_pair_intraday.py"
      - "tools/test_specific_pair_intraday.py"
      - ".github/workflows/research-intraday-pairs.yml"

permissions:
  contents: read

concurrency:
  group: research-intraday-pairs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  intraday-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install akshare pandas
      - name: Verify lagged contract selection and day-session causality
        run: python tools/test_specific_pair_intraday.py
      - name: Fetch targeted concrete 60-minute contracts
        run: python tools/fetch_specific_pair_60m_universe.py
      - name: Validate roll-safe intraday pair rotation
        run: |
          python tools/evaluate_specific_pair_intraday.py
          python - <<'PY'
          import json
          report = json.load(open("runtime/specific_pair_intraday_report.json", encoding="utf-8"))
          assert report["specific_contracts"] is True
          assert report["roll_safe"] is True
          assert report["pristine_final_oos"] is True
          assert report["day_session_only"] is True
          assert report["historical_l1_available"] is False
          assert report["profile_count"] == 24
          assert report["max_active_pairs"] == 1
          assert report["selected_leverage"] <= report["max_gross_leverage"]
          assert report["common_bars"] >= 1000
          print(json.dumps({
              "common_bars": report["common_bars"],
              "data_quality": report["data_quality"],
              "support": report["support"],
              "selected_profile": report["selected_profile"],
              "selected_leverage": report["selected_leverage"],
              "selected_oos": report["selected_oos"],
              "selected_full_recent": report["selected_full_recent"],
              "alpha_survives_intraday": report["alpha_survives_intraday"],
              "alpha_reasons": report["alpha_reasons"],
              "target": report["target"],
          }, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specific-pair-intraday-evidence
          path: |
            runtime/specific_pair_60m_contracts.csv
            runtime/specific_pair_60m_summary.csv
            runtime/specific_pair_60m_failures.txt
            runtime/specific_pair_60m_selection.csv
            runtime/specific_pair_intraday_report.json
          retention-days: 14
