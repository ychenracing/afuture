name: research-return-target

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/evaluate_return_target_portfolio.py"
      - "tools/test_return_target_portfolio.py"
      - "tools/fetch_broad_daily_universe.py"
      - ".github/workflows/research-return-target.yml"

permissions:
  contents: read

concurrency:
  group: research-return-target-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  return-target:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pandas numpy
      - name: Verify return-target causality and portfolio bounds
        run: python tools/test_return_target_portfolio.py
