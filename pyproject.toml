[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afuture"
version = "0.2.0"
description = "Focused Chinese futures calendar-spread and directional portfolio trading engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
]

[project.optional-dependencies]
live = [
  "vnpy>=4.4,<5",
  "vnpy_ctp>=6.7.11.4,<7",
  "akshare>=1.17",
]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
afuture = "afuture.cli:main"

[tool.setuptools.packages.find]
include = ["afuture*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
