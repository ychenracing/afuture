[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afuture"
version = "0.2.0"
description = "面向个人投资者的国内期货跨期套利交易系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
live = ["vnpy>=4.4,<5.0", "vnpy_ctp==6.7.11.4"]
dev = ["pytest>=8,<10"]

[project.scripts]
afuture = "afuture.cli:main"

[tool.setuptools.packages.find]
include = ["afuture*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
